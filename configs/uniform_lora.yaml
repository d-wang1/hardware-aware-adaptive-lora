method: uniform

model:
  name: distilbert-base-uncased
  task: sst2

lora:
  target_modules:
    - q_lin
    - v_lin
    - lin1
    - lin2
  rank: 8                  # uniform across all targets
  total_rank_budget: 192   # 24 modules * rank 8; shared across methods
  alpha_lora: 16
  dropout: 0.0

training:
  batch_size: 32
  learning_rate: 2.0e-4
  epochs: 3
  eval_interval: 100
  seed: 42

hardware:
  log_memory: true
  log_wall_clock: true
  log_examples_per_second: true

logging:
  output_dir: results/raw_logs/uniform
  target_accuracy: 0.90
